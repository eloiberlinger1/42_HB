[project]
name = "llm-sdk"
version = "0.1.0"
description = "call_me_maybe from 42 projects"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.0.0",
    "transformers>=4.40.0",
    "huggingface-hub>=0.20.0",
]

[tool.mypy]
exclude = ["llm_sdk"]

[[tool.mypy.overrides]]
module = "llm_sdk.*"
ignore_errors = true
follow_imports = "skip"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["llm_sdk"]


[project.optional-dependencies]
dev = [
    "pytest",
    "black",
    "ruff"
]
